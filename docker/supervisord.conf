; nginx, php-fpm and the queue worker that runs the deployments.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel scheduler: update checks every 6 h and the optional nightly update window.
[program:scheduler]
command=php /app/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Each worker runs one deployment at a time; two workers = two parallel deployments.
; Keep DB_QUEUE_RETRY_AFTER (Dockerfile, 7600) > --timeout (7300) > RunDeployment::TIMEOUT (7200),
; otherwise a long deployment would be handed to a second worker or killed before it can clean up.
[program:queue]
command=php /app/artisan queue:work --sleep=1 --tries=1 --timeout=7300 --max-time=86400
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
stopwaitsecs=30
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
